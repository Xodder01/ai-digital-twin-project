<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Digital Twin — Sign In</title>
    <meta name="description" content="Sign in or create your AI Digital Twin account to get personalized academic performance predictions.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>

<div class="auth-wrapper">

    <!-- Brand Header -->
    <div class="brand-header">
        <div class="brand-logo">
            <span class="logo-dot"></span>
            Digital Twin
        </div>
        <p class="brand-tagline">AI-powered academic performance prediction</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">

        <!-- Tab Switcher -->
        <div class="tab-switcher" role="tablist">
            <button class="tab-btn active" id="tabSignIn" role="tab" aria-selected="true" onclick="switchTab('signin')">Sign In</button>
            <button class="tab-btn" id="tabSignUp" role="tab" aria-selected="false" onclick="switchTab('signup')">Create Account</button>
        </div>

        <!-- ── SIGN IN PANEL ─────────────────────────────────────────── -->
        <div class="form-panel active" id="panelSignin">
            <h1 class="panel-title">Welcome back</h1>
            <p class="panel-subtitle">Sign in to resume your AI Twin session</p>

            <div class="form-msg" id="signinMsg"></div>

            <form id="signinForm" onsubmit="handleSignIn(event)" novalidate>
                <div class="field-group">
                    <label class="field-label" for="siEmail">Email address</label>
                    <input class="field-input" type="email" id="siEmail" placeholder="you@university.ac.in" required autocomplete="email">
                </div>
                <div class="field-group">
                    <label class="field-label" for="siPassword">Password</label>
                    <input class="field-input" type="password" id="siPassword" placeholder="Your password" required autocomplete="current-password">
                </div>

                <button type="submit" class="submit-btn" id="signinBtn">Sign In →</button>
            </form>

            <div class="divider">or continue with</div>

            <div class="social-row">
                <button class="social-btn" onclick="socialLogin('Google')" type="button">
                    <!-- Google logo SVG -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                <button class="social-btn" onclick="socialLogin('GitHub')" type="button">
                    <!-- GitHub logo SVG -->
                    <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                    </svg>
                    GitHub
                </button>
            </div>
        </div>

        <!-- ── SIGN UP PANEL ─────────────────────────────────────────── -->
        <div class="form-panel" id="panelSignup">
            <h1 class="panel-title">Create your Twin</h1>
            <p class="panel-subtitle">Set up your AI-powered student profile</p>

            <div class="form-msg" id="signupMsg"></div>

            <form id="signupForm" onsubmit="handleSignUp(event)" novalidate>

                <!-- Name + Age -->
                <div class="field-row">
                    <div>
                        <label class="field-label" for="suName">Full Name</label>
                        <input class="field-input" type="text" id="suName" placeholder="Abhay Singh" required autocomplete="name">
                    </div>
                    <div>
                        <label class="field-label" for="suAge">Age</label>
                        <input class="field-input" type="number" id="suAge" placeholder="21" min="13" max="60" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="field-group">
                    <label class="field-label" for="suEmail">Email address</label>
                    <input class="field-input" type="email" id="suEmail" placeholder="you@university.ac.in" required autocomplete="email">
                </div>

                <!-- Password -->
                <div class="field-group">
                    <label class="field-label" for="suPassword">Password</label>
                    <input class="field-input" type="password" id="suPassword" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
                </div>

                <!-- Gender Pills -->
                <div class="field-group">
                    <label class="field-label">Gender</label>
                    <div class="gender-grid">
                        <label class="type-pill" id="gMale" onclick="selectGender('Male', this)">
                            <input type="radio" name="gender" value="Male">
                            <span class="pill-icon">♂️</span>
                            <span class="pill-label">Male</span>
                        </label>
                        <label class="type-pill" id="gFemale" onclick="selectGender('Female', this)">
                            <input type="radio" name="gender" value="Female">
                            <span class="pill-icon">♀️</span>
                            <span class="pill-label">Female</span>
                        </label>
                        <label class="type-pill" id="gOther" onclick="selectGender('Other', this)">
                            <input type="radio" name="gender" value="Other">
                            <span class="pill-icon">⚧️</span>
                            <span class="pill-label">Other</span>
                        </label>
                    </div>
                </div>

                <!-- User Type Pills -->
                <div class="field-group">
                    <label class="field-label">I am a...</label>
                    <div class="user-type-grid">
                        <label class="type-pill" id="typeUG" onclick="selectType('Undergraduate', this)">
                            <input type="radio" name="userType" value="Undergraduate">
                            <span class="pill-icon">🎓</span>
                            <span class="pill-label">Undergrad</span>
                        </label>
                        <label class="type-pill" id="typePG" onclick="selectType('Postgraduate', this)">
                            <input type="radio" name="userType" value="Postgraduate">
                            <span class="pill-icon">📚</span>
                            <span class="pill-label">Postgrad</span>
                        </label>
                        <label class="type-pill" id="typeRes" onclick="selectType('Researcher', this)">
                            <input type="radio" name="userType" value="Researcher">
                            <span class="pill-icon">🔬</span>
                            <span class="pill-label">Researcher</span>
                        </label>
                        <label class="type-pill" id="typePro" onclick="selectType('Professional', this)">
                            <input type="radio" name="userType" value="Professional">
                            <span class="pill-icon">💼</span>
                            <span class="pill-label">Professional</span>
                        </label>
                        <label class="type-pill" id="typeTeach" onclick="selectType('Educator', this)">
                            <input type="radio" name="userType" value="Educator">
                            <span class="pill-icon">🧑‍🏫</span>
                            <span class="pill-label">Educator</span>
                        </label>
                        <label class="type-pill" id="typeOther" onclick="selectType('Other', this)">
                            <input type="radio" name="userType" value="Other">
                            <span class="pill-icon">✨</span>
                            <span class="pill-label">Other</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="signupBtn">Create My Twin →</button>
            </form>

            <div class="divider">or continue with</div>

            <div class="social-row">
                <button class="social-btn" onclick="socialLogin('Google')" type="button">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                <button class="social-btn" onclick="socialLogin('GitHub')" type="button">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                    </svg>
                    GitHub
                </button>
            </div>
        </div>

    </div><!-- /.auth-card -->

    <p class="auth-footer">
        By continuing, you agree to our <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a>
    </p>

</div><!-- /.auth-wrapper -->

<script>
// ── State ──────────────────────────────────────────────────────────────────
let selectedGender = '';
let selectedType = '';

// ── Tab switch ─────────────────────────────────────────────────────────────
function switchTab(tab) {
    const panels   = document.querySelectorAll('.form-panel');
    const tabBtns  = document.querySelectorAll('.tab-btn');
    panels.forEach(p  => p.classList.remove('active'));
    tabBtns.forEach(b => b.classList.remove('active'));

    document.getElementById('panel' + (tab === 'signin' ? 'Signin' : 'Signup')).classList.add('active');
    document.getElementById(tab === 'signin' ? 'tabSignIn' : 'tabSignUp').classList.add('active');
    clearMessages();
}

// ── Pill selectors ─────────────────────────────────────────────────────────
function selectGender(val, el) {
    selectedGender = val;
    document.querySelectorAll('.gender-grid .type-pill').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
}
function selectType(val, el) {
    selectedType = val;
    document.querySelectorAll('.user-type-grid .type-pill').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
}

// ── Message helpers ────────────────────────────────────────────────────────
function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'form-msg ' + type + ' show';
}
function clearMessages() {
    document.querySelectorAll('.form-msg').forEach(m => m.className = 'form-msg');
}

// ── Sign In ────────────────────────────────────────────────────────────────
async function handleSignIn(event) {
    event.preventDefault();
    const email    = document.getElementById('siEmail').value.trim();
    const password = document.getElementById('siPassword').value;
    const btn      = document.getElementById('signinBtn');

    if (!email || !password) {
        showMsg('signinMsg', '⚠ Please fill in all fields.', 'error'); return;
    }

    btn.textContent = 'Signing in...';
    btn.disabled = true;

    try {
        const res = await fetch('/auth/signin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
            showMsg('signinMsg', '✓ Welcome back, ' + data.name + '! Redirecting...', 'success');
            setTimeout(() => window.location.href = '/', 1000);
        } else {
            showMsg('signinMsg', '✗ ' + (data.error || 'Invalid credentials.'), 'error');
            btn.textContent = 'Sign In →';
            btn.disabled = false;
        }
    } catch {
        showMsg('signinMsg', '✗ Could not connect to server.', 'error');
        btn.textContent = 'Sign In →';
        btn.disabled = false;
    }
}

// ── Sign Up ────────────────────────────────────────────────────────────────
async function handleSignUp(event) {
    event.preventDefault();
    const name     = document.getElementById('suName').value.trim();
    const age      = document.getElementById('suAge').value.trim();
    const email    = document.getElementById('suEmail').value.trim();
    const password = document.getElementById('suPassword').value;
    const btn      = document.getElementById('signupBtn');

    if (!name || !age || !email || !password) {
        showMsg('signupMsg', '⚠ Please fill in all required fields.', 'error'); return;
    }
    if (!selectedGender) {
        showMsg('signupMsg', '⚠ Please select your gender.', 'error'); return;
    }
    if (!selectedType) {
        showMsg('signupMsg', '⚠ Please select the type of user you are.', 'error'); return;
    }
    if (password.length < 8) {
        showMsg('signupMsg', '⚠ Password must be at least 8 characters.', 'error'); return;
    }

    btn.textContent = 'Creating Twin...';
    btn.disabled = true;

    try {
        const res = await fetch('/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, age: parseInt(age), email, password, gender: selectedGender, user_type: selectedType })
        });
        const data = await res.json();

        if (res.ok && data.success) {
            showMsg('signupMsg', '✓ Account created! Launching your Digital Twin...', 'success');
            setTimeout(() => window.location.href = '/', 1200);
        } else {
            showMsg('signupMsg', '✗ ' + (data.error || 'Registration failed.'), 'error');
            btn.textContent = 'Create My Twin →';
            btn.disabled = false;
        }
    } catch {
        showMsg('signupMsg', '✗ Could not connect to server.', 'error');
        btn.textContent = 'Create My Twin →';
        btn.disabled = false;
    }
}

// ── Social login placeholder ───────────────────────────────────────────────
function socialLogin(provider) {
    alert('Social login with ' + provider + ' is not configured yet.\nPlease use email/password for the demo.');
}
</script>
</body>
</html>
